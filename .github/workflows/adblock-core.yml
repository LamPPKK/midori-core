name: Adblock core

on:
  push:
    paths:
      - xanh-adblock-core/**
      - scripts/verify_adblock_latest.py
      - scripts/tests/test_verify_adblock_latest.py
      - scripts/build-adblock-android.sh
      - scripts/verify-android-16k.sh
      - CMakeLists.txt
      - desktop/adblock-**
      - desktop/browser-window.vala
      - THIRD_PARTY_NOTICES.md
      - docs/ADBLOCK.md
      - platform/apple/App/xanh-adblock-baseline.json
      - platform/apple/App/AppleAdblockContentBlocker.swift
      - platform/apple/Sources/XanhBrowserCore/AdblockHost.swift
      - platform/apple/Tests/XanhBrowserCoreTests/AdblockHostTests.swift
      - .github/workflows/adblock-core.yml
  pull_request:
    paths:
      - xanh-adblock-core/**
      - scripts/verify_adblock_latest.py
      - scripts/tests/test_verify_adblock_latest.py
      - scripts/build-adblock-android.sh
      - scripts/verify-android-16k.sh
      - CMakeLists.txt
      - desktop/adblock-**
      - desktop/browser-window.vala
      - THIRD_PARTY_NOTICES.md
      - docs/ADBLOCK.md
      - platform/apple/App/xanh-adblock-baseline.json
      - platform/apple/App/AppleAdblockContentBlocker.swift
      - platform/apple/Sources/XanhBrowserCore/AdblockHost.swift
      - platform/apple/Tests/XanhBrowserCoreTests/AdblockHostTests.swift
      - .github/workflows/adblock-core.yml
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-contract-and-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Verify latest stable upstream and exact crate closure
        run: |
          python3 -B -m unittest scripts/tests/test_verify_adblock_latest.py -v
          python3 -B scripts/verify_adblock_latest.py
      - name: Format, test and lint the shared core
        run: |
          cargo fmt --manifest-path xanh-adblock-core/Cargo.toml --check
          cargo test --locked --manifest-path xanh-adblock-core/Cargo.toml
          cargo clippy --locked --all-targets \
            --manifest-path xanh-adblock-core/Cargo.toml -- -D warnings
      - name: Verify the Apple bundled rules are generated by the pinned core
        run: |
          cargo run --locked --quiet \
            --manifest-path xanh-adblock-core/Cargo.toml \
            --example compile_default_webkit \
            > "$RUNNER_TEMP/xanh-adblock-baseline.json"
          cmp "$RUNNER_TEMP/xanh-adblock-baseline.json" \
            platform/apple/App/xanh-adblock-baseline.json
      - name: Compile and run the stable C ABI smoke test
        run: |
          cargo build --locked --manifest-path xanh-adblock-core/Cargo.toml
          cc -std=c11 -Wall -Wextra -Werror \
            -Ixanh-adblock-core/include \
            xanh-adblock-core/tests/c_abi_smoke.c \
            -Lxanh-adblock-core/target/debug -lxanh_adblock_core \
            -o "$RUNNER_TEMP/xanh-adblock-c-abi-smoke"
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/xanh-adblock-core/target/debug" \
            "$RUNNER_TEMP/xanh-adblock-c-abi-smoke"
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: xanh-adblock-core
      - uses: anchore/sbom-action@v0
        with:
          path: xanh-adblock-core
          format: cyclonedx-json
          artifact-name: xanh-adblock-core-sbom.cdx.json

  android-native-artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install the pinned Android NDK
        run: sdkmanager 'ndk;29.0.14206865'
      - name: Cross-build and verify three Android ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: ./scripts/build-adblock-android.sh "$RUNNER_TEMP/xanh-adblock-android"
      - uses: actions/upload-artifact@v4
        with:
          name: xanh-adblock-core-android-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/xanh-adblock-android
