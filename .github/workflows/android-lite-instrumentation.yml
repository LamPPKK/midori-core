name: Android Lite instrumentation

on:
  push:
    branches: [ master, codex/xanh-browser-modernization ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '53 2 * * 6'

permissions:
  contents: read

jobs:
  connected-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            profile: pixel_2
          - api-level: 30
            profile: pixel_6
          - api-level: 33
            profile: pixel_6
          - api-level: 36
            profile: pixel_6
          - api-level: 36
            profile: pixel_tablet
          - api-level: 36
            profile: '7.6in Foldable'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

  connected-webkit-preview:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 36]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon :app-webkit:connectedDebugAndroidTest
