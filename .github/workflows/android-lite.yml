name: Android Lite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.1.0' 'ndk;29.0.14206865'
      - name: Build and verify the pinned native blocker
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: ./scripts/build-adblock-android.sh "$RUNNER_TEMP/xanh-adblock-android"
      - run: >-
          ./gradlew --no-daemon
          -PxanhAdblockNativeDir="$RUNNER_TEMP/xanh-adblock-android"
          -PxanhAndroidNdkDir="$ANDROID_HOME/ndk/29.0.14206865"
          :backup-core:testDebugUnitTest
          :app:lintDebug
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:verifyAdblockNativeRelease
          :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: xanh-browser-lite
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-debug.*

  sync-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out the reviewed Android Sync AAR source
        uses: actions/checkout@v6
        with:
          repository: LamPPKK/xanh-android
          ref: main
          path: _sync_android
      - name: Select the matching Android integration branch when it exists
        working-directory: _sync_android
        env:
          SYNC_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if git fetch origin "$SYNC_REF"; then
            git checkout --detach FETCH_HEAD
          else
            echo "No matching Android branch; using main"
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.1.0' 'ndk;29.0.14206865'
      - name: Build and verify the pinned native blocker
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: ./scripts/build-adblock-android.sh "$RUNNER_TEMP/xanh-adblock-android"
      - name: Publish the pinned Android Sync AAR to a local repository
        working-directory: _sync_android
        run: ./gradlew --no-daemon :sync-core:publishReleasePublicationToBuildRepository
      - name: Build the base-only Lite release
        run: |
          ./gradlew --no-daemon \
            -PxanhAdblockNativeDir="$RUNNER_TEMP/xanh-adblock-android" \
            -PxanhAndroidNdkDir="$ANDROID_HOME/ndk/29.0.14206865" \
            :app:verifyAdblockNativeRelease \
            :app:bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/xanh-browser-lite-base.aab"
      - name: Build and lint the on-demand System WebView and WPE features
        run: |
          ./gradlew --no-daemon --refresh-dependencies \
            -PxanhAdblockNativeDir="$RUNNER_TEMP/xanh-adblock-android" \
            -PxanhAndroidNdkDir="$ANDROID_HOME/ndk/29.0.14206865" \
            -PxanhEnableSyncFeature=true \
            -PxanhSyncSelfHostedOnly=true \
            -PxanhSyncRepository="$GITHUB_WORKSPACE/_sync_android/sync-core/build/maven" \
            :sync-feature-common:testDebugUnitTest \
            :sync-feature-common:lintDebug \
            :app:lintDebug \
            :app-webkit:lintDebug \
            :sync_feature:assembleDebug \
            :sync_feature_wpe:assembleDebug \
            :app:verifyAdblockNativeRelease \
            :app:bundleRelease \
            :app-webkit:bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab \
            "$RUNNER_TEMP/xanh-browser-lite-with-sync.aab"
          cp app-webkit/build/outputs/bundle/release/app-webkit-release.aab \
            "$RUNNER_TEMP/xanh-browser-wpe-with-sync.aab"
      - name: Enforce the Lite base-size and split-install boundaries
        run: >-
          ./scripts/verify-lite-sync-size.sh
          "$RUNNER_TEMP/xanh-browser-lite-base.aab"
          "$RUNNER_TEMP/xanh-browser-lite-with-sync.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: xanh-browser-lite-sync-preview
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/xanh-browser-lite-with-sync.aab
            ${{ runner.temp }}/xanh-browser-wpe-with-sync.aab
            sync-feature-common/build/reports/lint-results-debug.*
            app/build/reports/lint-results-debug.*
            app-webkit/build/reports/lint-results-debug.*

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
