name: Android build-tool stable baseline

on:
  push:
    paths:
      - .github/workflows/android-toolchain-baseline.yml
      - scripts/verify_android_toolchain_latest.py
      - scripts/tests/test_verify_android_toolchain_latest.py
      - build.gradle
      - gradle/wrapper/gradle-wrapper.jar
      - gradle/wrapper/gradle-wrapper.properties
      - gradlew
      - gradlew.bat
  pull_request:
    paths:
      - .github/workflows/android-toolchain-baseline.yml
      - scripts/verify_android_toolchain_latest.py
      - scripts/tests/test_verify_android_toolchain_latest.py
      - build.gradle
      - gradle/wrapper/gradle-wrapper.jar
      - gradle/wrapper/gradle-wrapper.properties
      - gradlew
      - gradlew.bat
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-toolchain-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test latest-stable parser and project pin policy
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_verify_android_toolchain_latest.py' -v
      - name: Verify latest official stable AGP and Gradle
        run: python3 scripts/verify_android_toolchain_latest.py
