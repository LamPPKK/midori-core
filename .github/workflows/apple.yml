name: Apple platforms

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Verify Xcode and WebKit SDK baseline
        run: |
          xcodebuild -version
          sdk_major="$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)"
          test "$sdk_major" -ge 26
          entitlements='platform/apple/Config/XanhBrowserMac.entitlements'
          for key in \
            com.apple.security.app-sandbox \
            com.apple.security.device.camera \
            com.apple.security.device.microphone \
            com.apple.security.network.client \
            com.apple.security.personal-information.location
          do
            test "$(/usr/libexec/PlistBuddy -c "Print :$key" "$entitlements")" = true
          done
      - name: Test shared Apple core
        run: swift test --package-path platform/apple
      - name: Verify bundled content rules come from the pinned Rust core
        run: |
          cargo run --locked --quiet \
            --manifest-path xanh-adblock-core/Cargo.toml \
            --example compile_default_webkit \
            > "$RUNNER_TEMP/xanh-adblock-baseline.json"
          cmp "$RUNNER_TEMP/xanh-adblock-baseline.json" \
            platform/apple/App/xanh-adblock-baseline.json
      - name: Build macOS application
        run: |
          xcodebuild \
            -project platform/apple/XanhBrowserApple.xcodeproj \
            -scheme XanhBrowser-macOS \
            -configuration Release \
            -derivedDataPath _build/apple-macos \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build universal iOS and iPadOS application
        run: |
          xcodebuild \
            -project platform/apple/XanhBrowserApple.xcodeproj \
            -scheme XanhBrowser-iOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath _build/apple-ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify artifact identities
        run: |
          mac_info='_build/apple-macos/Build/Products/Release/Xanh Browser.app/Contents/Info.plist'
          ios_info='_build/apple-ios/Build/Products/Release-iphonesimulator/Xanh Browser.app/Info.plist'
          test "$(plutil -extract CFBundleIdentifier raw "$mac_info")" = io.github.lamppkk.xanhbrowser.macos
          test "$(plutil -extract CFBundleShortVersionString raw "$mac_info")" = 1.0.0
          test "$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$mac_info")" = xanh-browser-macos
          test "$(plutil -extract CFBundleIdentifier raw "$ios_info")" = io.github.lamppkk.xanhbrowser
          test "$(plutil -extract CFBundleShortVersionString raw "$ios_info")" = 1.0.0
          test "$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "$ios_info")" = xanh-browser-ios
          mac_resources='_build/apple-macos/Build/Products/Release/Xanh Browser.app/Contents/Resources'
          ios_resources='_build/apple-ios/Build/Products/Release-iphonesimulator/Xanh Browser.app'
          for resources in "$mac_resources" "$ios_resources"
          do
            cmp platform/apple/App/xanh-adblock-baseline.json \
              "$resources/xanh-adblock-baseline.json"
            cmp THIRD_PARTY_NOTICES.md "$resources/THIRD_PARTY_NOTICES.md"
            cmp xanh-adblock-core/LICENSE "$resources/LICENSE"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: xanh-browser-apple-unsigned
          if-no-files-found: error
          path: |
            _build/apple-macos/Build/Products/Release/*.app
            _build/apple-ios/Build/Products/Release-iphonesimulator/*.app

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
