name: Application Services stable baseline

on:
  push:
    paths:
      - .github/workflows/application-services-baseline.yml
      - scripts/verify_application_services_latest.py
      - scripts/tests/test_verify_application_services_latest.py
      - scripts/verify-sync-release.sh
      - xanh-sync-core/APPLICATION_SERVICES.lock
      - xanh-sync-core/Cargo.toml
      - xanh-sync-core/Cargo.lock
      - xanh-sync-core/src/lib.rs
      - THIRD_PARTY_NOTICES.md
  pull_request:
    paths:
      - .github/workflows/application-services-baseline.yml
      - scripts/verify_application_services_latest.py
      - scripts/tests/test_verify_application_services_latest.py
      - scripts/verify-sync-release.sh
      - xanh-sync-core/APPLICATION_SERVICES.lock
      - xanh-sync-core/Cargo.toml
      - xanh-sync-core/Cargo.lock
      - xanh-sync-core/src/lib.rs
      - THIRD_PARTY_NOTICES.md
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-services-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test official-tag parser and dependency closure
        run: >-
          python3 -B -m unittest discover -s scripts/tests
          -p 'test_verify_application_services_latest.py' -v
      - name: Verify latest stable Mozilla Application Services
        run: python3 scripts/verify_application_services_latest.py
