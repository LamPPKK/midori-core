name: Capture app previews

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux desktop preview
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build and capture dependencies
        run: >-
          pacman -Syu --noconfirm
          git cmake ninja vala gtk4 webkitgtk-6.0 libsoup3 sqlite libpeas-2
          gcr-4 json-glib appstream dbus xorg-server-xvfb xorg-xdpyinfo
          xdotool imagemagick
      - uses: actions/checkout@v6
      - run: cmake -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build _build
      - run: dbus-uuidgen --ensure=/etc/machine-id
      - name: Capture the real GTK application
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x960x24' bash -euo pipefail <<'SCRIPT'
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          _build/xanh-browser https://example.com >xanh-browser.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          window=''
          for _ in $(seq 1 30); do
            window="$(xdotool search --onlyvisible --name 'Xanh Browser' 2>/dev/null | head -n 1 || true)"
            test -n "$window" && break
            sleep 1
          done
          test -n "$window"
          xdotool windowsize "$window" 1280 800
          xdotool windowmove "$window" 80 60
          sleep 10
          import -window "$window" app-preview-linux.png
          test -s app-preview-linux.png
          SCRIPT
      - uses: actions/upload-artifact@v4
        with:
          name: app-preview-linux
          if-no-files-found: error
          path: app-preview-linux.png

  macos:
    name: macOS preview
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Build the real macOS application
        run: |
          xcodebuild \
            -project platform/apple/XanhBrowserApple.xcodeproj \
            -scheme XanhBrowser-macOS \
            -configuration Release \
            -derivedDataPath _build/apple-macos \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Capture the real SwiftUI application
        shell: bash
        run: |
          set -euo pipefail
          app='_build/apple-macos/Build/Products/Release/Xanh Browser.app'
          open -na "$app"
          sleep 12
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            tell process "Xanh Browser"
              set frontmost to true
              set position of front window to {80, 70}
              set size of front window to {1280, 800}
            end tell
          end tell
          APPLESCRIPT
          sleep 3
          screencapture -x app-preview-macos.png
          test -s app-preview-macos.png
      - uses: actions/upload-artifact@v4
        with:
          name: app-preview-macos
          if-no-files-found: error
          path: app-preview-macos.png

  windows:
    name: Windows preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
          cache: true
          cache-dependency-path: platform/windows/**/*.csproj
      - name: Publish the real WinUI application
        run: >-
          dotnet publish platform/windows/src/XanhBrowser.Windows/XanhBrowser.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Platform=x64
          --output _artifact/win-x64
      - name: Capture the real WinUI application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process '_artifact/win-x64/XanhBrowser.Windows.exe' -PassThru
          for ($attempt = 0; $attempt -lt 45; $attempt++) {
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { throw "Xanh Browser exited with code $($process.ExitCode)" }
            if ($process.MainWindowHandle -ne 0) { break }
          }
          if ($process.MainWindowHandle -eq 0) { throw 'Xanh Browser did not create a visible window' }
          Start-Sleep -Seconds 10
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class XanhWindowCapture {
              [StructLayout(LayoutKind.Sequential)]
              public struct RECT { public int Left, Top, Right, Bottom; }
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
          }
          '@
          $rect = New-Object XanhWindowCapture+RECT
          if (-not [XanhWindowCapture]::GetWindowRect($process.MainWindowHandle, [ref]$rect)) {
            throw 'Could not read the Xanh Browser window bounds'
          }
          $width = $rect.Right - $rect.Left
          $height = $rect.Bottom - $rect.Top
          $bitmap = New-Object System.Drawing.Bitmap $width, $height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          try {
            $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size)
            $bitmap.Save((Join-Path $PWD 'app-preview-windows.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          } finally {
            $graphics.Dispose()
            $bitmap.Dispose()
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path 'app-preview-windows.png')) { throw 'Preview was not captured' }
      - uses: actions/upload-artifact@v4
        with:
          name: app-preview-windows
          if-no-files-found: error
          path: app-preview-windows.png
