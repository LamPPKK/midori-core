name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out the reviewed Android Sync AAR source
        uses: actions/checkout@v6
        with:
          repository: LamPPKK/xanh-android
          ref: main
          path: _sync_android
      - name: Select the matching Android integration branch when it exists
        working-directory: _sync_android
        env:
          SYNC_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if git fetch origin "$SYNC_REF"; then
            git checkout --detach FETCH_HEAD
          else
            echo "No matching Android branch; using main"
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Publish the pinned Android Sync AAR locally
        working-directory: _sync_android
        run: ./gradlew --no-daemon :sync-core:publishReleasePublicationToBuildRepository
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
      - run: >-
          ./gradlew --no-daemon --no-build-cache
          -PxanhEnableSyncFeature=true
          -PxanhSyncSelfHostedOnly=true
          -PxanhSyncRepository="$GITHUB_WORKSPACE/_sync_android/sync-core/build/maven"
          clean
          :app:assembleDebug
          :app-webkit:assembleDebug
          :sync_feature:assembleDebug
          :sync_feature_wpe:assembleDebug
      - uses: github/codeql-action/analyze@v4

  desktop:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git cmake ninja vala gtk4 webkitgtk-6.0 libsoup3 sqlite libpeas-2 gcr-4 json-glib
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: cpp
      - run: cmake -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build _build
      - uses: github/codeql-action/analyze@v4

  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
      - run: >-
          xcodebuild
          -project platform/apple/XanhBrowserApple.xcodeproj
          -scheme XanhBrowser-macOS
          -configuration Debug
          -derivedDataPath _build/codeql-apple
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: github/codeql-action/analyze@v4

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
      - run: >-
          dotnet build platform/windows/src/XanhBrowser.Windows/XanhBrowser.Windows.csproj
          --configuration Debug
          -p:Platform=x64
      - uses: github/codeql-action/analyze@v4
