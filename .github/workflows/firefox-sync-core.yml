name: Firefox Sync core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-contract-and-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Verify pinned Application Services release
        run: |
          grep -Fx 'version=155.0' xanh-sync-core/APPLICATION_SERVICES.lock
          grep -Fx 'revision=c0fd8cea40c9b5dafc6604831f7bd7a8c096d313' xanh-sync-core/APPLICATION_SERVICES.lock
          cargo fmt --manifest-path xanh-sync-core/Cargo.toml --check
      - name: Test portable contract and FFI policy
        run: cargo test --locked --manifest-path xanh-sync-core/Cargo.toml
      - name: Compile-check Mozilla backend API
        run: |
          mkdir -p "$RUNNER_TEMP/fake-nss/lib" "$RUNNER_TEMP/fake-nss/include"
          NSS_DIR="$RUNNER_TEMP/fake-nss" NSS_STATIC=1 \
            cargo check --locked --features mozilla --manifest-path xanh-sync-core/Cargo.toml
      - name: Clippy
        run: >-
          NSS_DIR="$RUNNER_TEMP/fake-nss" NSS_STATIC=1
          cargo clippy --locked --features mozilla
          --manifest-path xanh-sync-core/Cargo.toml -- -D warnings
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: xanh-sync-core
      - uses: anchore/sbom-action@v0
        with:
          path: xanh-sync-core
          format: cyclonedx-json
          artifact-name: xanh-sync-core-sbom.cdx.json

  license-and-release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/verify-sync-release.sh source

  native-linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install NSS and Linux host build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libnss3-dev libnspr4-dev libsecret-1-dev libjson-glib-dev
      - name: Prepare the NSS layout required by Application Services
        run: |
          mkdir -p "$RUNNER_TEMP/nss/lib" "$RUNNER_TEMP/nss/include"
          nss_libdir="$(pkg-config --variable=libdir nss)"
          nspr_libdir="$(pkg-config --variable=libdir nspr)"
          for library in libfreebl3.so libnss3.so libnssckbi.so libsoftokn3.so \
            libnssutil3.so; do
              test -f "$nss_libdir/$library"
              ln -sf "$nss_libdir/$library" "$RUNNER_TEMP/nss/lib/$library"
          done
          for library in libnspr4.so libplc4.so libplds4.so; do
              test -f "$nspr_libdir/$library"
              ln -sf "$nspr_libdir/$library" "$RUNNER_TEMP/nss/lib/$library"
          done
          cp -R /usr/include/nss/. "$RUNNER_TEMP/nss/include/"
          cp -R /usr/include/nspr/. "$RUNNER_TEMP/nss/include/"
      - name: Build the pinned native core
        run: |
          NSS_DIR="$RUNNER_TEMP/nss" LD_LIBRARY_PATH="$RUNNER_TEMP/nss/lib" \
            cargo test --locked --features mozilla \
            --manifest-path xanh-sync-core/Cargo.toml
          NSS_DIR="$RUNNER_TEMP/nss" cargo build --locked --release --features mozilla \
            --manifest-path xanh-sync-core/Cargo.toml
          ldd xanh-sync-core/target/release/libxanh_sync_core.so
          sha256sum xanh-sync-core/target/release/libxanh_sync_core.so \
            > xanh-sync-core/target/release/libxanh_sync_core.so.sha256
      - name: Generate the reviewed Kotlin and Swift UniFFI bindings
        working-directory: xanh-sync-core
        run: |
          mkdir -p target/bindings/kotlin target/bindings/swift
          CARGO_TARGET_DIR="$RUNNER_TEMP/uniffi-tool" \
            cargo run --locked --release --features bindgen-cli --manifest-path Cargo.toml \
            --bin xanh-uniffi-bindgen -- generate \
            --library target/release/libxanh_sync_core.so \
            --crate xanh_sync_core \
            --language kotlin --no-format --out-dir target/bindings/kotlin
          CARGO_TARGET_DIR="$RUNNER_TEMP/uniffi-tool" \
            cargo run --locked --release --features bindgen-cli --manifest-path Cargo.toml \
            --bin xanh-uniffi-bindgen -- generate \
            --library target/release/libxanh_sync_core.so \
            --crate xanh_sync_core \
            --language swift --no-format --out-dir target/bindings/swift
          grep -R -F 'class MozillaSyncRuntime' target/bindings/kotlin
          grep -R -F 'class MozillaSyncRuntime' target/bindings/swift
          grep -R -F 'createBookmark' target/bindings/kotlin
          grep -R -F 'createBookmark' target/bindings/swift
          grep -R -F 'importLegacyBookmarks' target/bindings/kotlin
          grep -R -F 'importLegacyBookmarks' target/bindings/swift
          grep -R -F 'recordHistory' target/bindings/kotlin
          grep -R -F 'recordHistory' target/bindings/swift
          grep -R -F 'clearHistory' target/bindings/kotlin
          grep -R -F 'clearHistory' target/bindings/swift
          grep -R -F 'generateLocalLoginsKey' target/bindings/kotlin
          grep -R -F 'generateLocalLoginsKey' target/bindings/swift
      - name: Compile and run the Linux Secret Service host boundary
        run: |
          read -r -a host_cflags <<< "$(pkg-config --cflags gio-2.0 json-glib-1.0 libsecret-1)"
          read -r -a host_libs <<< "$(pkg-config --libs gio-2.0 json-glib-1.0 libsecret-1)"
          cc -std=c11 -Wall -Wextra -Werror -Wno-unused-parameter \
            -DXANH_ENABLE_FIREFOX_SYNC=1 \
            -Idesktop -Ixanh-sync-core/include \
            tests-modern/sync-host-production-test.c desktop/sync-host.c \
            "${host_cflags[@]}" "${host_libs[@]}" \
            -Lxanh-sync-core/target/release -lxanh_sync_core \
            -o "$RUNNER_TEMP/xanh-sync-host-production-test"
          LD_LIBRARY_PATH="$RUNNER_TEMP/nss/lib:$GITHUB_WORKSPACE/xanh-sync-core/target/release" \
            "$RUNNER_TEMP/xanh-sync-host-production-test"
      - name: Smoke-test the stable C ABI without exposing the generated key
        run: |
          LD_LIBRARY_PATH="$RUNNER_TEMP/nss/lib" python3 - <<'PY'
          import ctypes
          import json
          import tempfile

          core = ctypes.CDLL('xanh-sync-core/target/release/libxanh_sync_core.so')
          core.xanh_sync_core_version.restype = ctypes.c_void_p
          core.xanh_sync_generate_local_logins_key.restype = ctypes.c_void_p
          core.xanh_sync_string_free.argtypes = [ctypes.c_void_p]
          core.xanh_sync_runtime_open.argtypes = [
              ctypes.c_char_p,
              ctypes.c_char_p,
              ctypes.c_char_p,
              ctypes.c_char_p,
              ctypes.c_char_p,
          ]
          core.xanh_sync_runtime_open.restype = ctypes.c_void_p
          core.xanh_sync_runtime_free.argtypes = [ctypes.c_void_p]
          core.xanh_sync_runtime_update_local_tabs.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          core.xanh_sync_runtime_update_local_tabs.restype = ctypes.c_void_p
          core.xanh_sync_runtime_remote_tabs_json.argtypes = [ctypes.c_void_p]
          core.xanh_sync_runtime_remote_tabs_json.restype = ctypes.c_void_p
          core.xanh_sync_bookmark_root_guid.argtypes = [ctypes.c_int32]
          core.xanh_sync_bookmark_root_guid.restype = ctypes.c_void_p
          core.xanh_sync_runtime_create_bookmark.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          core.xanh_sync_runtime_create_bookmark.restype = ctypes.c_void_p
          core.xanh_sync_runtime_import_legacy_bookmarks.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          core.xanh_sync_runtime_import_legacy_bookmarks.restype = ctypes.c_void_p
          core.xanh_sync_runtime_bookmarks_json.argtypes = [ctypes.c_void_p, ctypes.c_int32]
          core.xanh_sync_runtime_bookmarks_json.restype = ctypes.c_void_p
          core.xanh_sync_runtime_update_bookmark.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          core.xanh_sync_runtime_update_bookmark.restype = ctypes.c_bool
          core.xanh_sync_runtime_delete_bookmark.argtypes = [ctypes.c_void_p, ctypes.c_char_p, ctypes.c_bool]
          core.xanh_sync_runtime_delete_bookmark.restype = ctypes.c_int32
          core.xanh_sync_runtime_record_history.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          core.xanh_sync_runtime_record_history.restype = ctypes.c_void_p
          core.xanh_sync_runtime_recent_history_json.argtypes = [ctypes.c_void_p, ctypes.c_uint32]
          core.xanh_sync_runtime_recent_history_json.restype = ctypes.c_void_p
          core.xanh_sync_runtime_delete_history_visit.argtypes = [
              ctypes.c_void_p,
              ctypes.c_char_p,
              ctypes.c_int64,
          ]
          core.xanh_sync_runtime_delete_history_visit.restype = ctypes.c_bool
          core.xanh_sync_runtime_clear_history.argtypes = [ctypes.c_void_p]
          core.xanh_sync_runtime_clear_history.restype = ctypes.c_bool

          version = core.xanh_sync_core_version()
          key = core.xanh_sync_generate_local_logins_key()
          assert version and key
          core.xanh_sync_string_free(version)
          core.xanh_sync_string_free(key)

          config = json.dumps({
              'server': {'kind': 'mozilla'},
              'client_id': 'xanh-ci-contract',
              'redirect_uri': 'xanh-browser://accounts/oauth',
              'device_name': 'Xanh Browser CI',
              'device_kind': 'desktop',
          }).encode()
          with tempfile.TemporaryDirectory() as profile:
              runtime = core.xanh_sync_runtime_open(
                  config, profile.encode(), None, None, None
              )
              assert runtime
              with tempfile.TemporaryDirectory() as second_profile:
                  second_runtime = core.xanh_sync_runtime_open(
                      config, second_profile.encode(), None, None, None
                  )
                  assert not second_runtime
              local_tabs = json.dumps([
                  {
                      'title': 'Regular',
                      'url_history': ['https://example.com/regular'],
                      'icon_url': None,
                      'last_used_epoch_millis': 1700000000000,
                      'is_private': False,
                      'is_pinned': True,
                  },
                  {
                      'title': 'Private',
                      'url_history': ['https://example.com/private'],
                      'icon_url': None,
                      'last_used_epoch_millis': 1700000000001,
                      'is_private': True,
                      'is_pinned': False,
                  },
              ]).encode()
              update = core.xanh_sync_runtime_update_local_tabs(runtime, local_tabs)
              assert update
              assert json.loads(ctypes.string_at(update)) == {
                  'accepted_count': 1,
                  'skipped_private_count': 1,
              }
              core.xanh_sync_string_free(update)
              remote = core.xanh_sync_runtime_remote_tabs_json(runtime)
              assert remote and json.loads(ctypes.string_at(remote)) == []
              core.xanh_sync_string_free(remote)

              root = core.xanh_sync_bookmark_root_guid(2)
              assert root and ctypes.string_at(root).decode() == 'unfiled_____'
              core.xanh_sync_string_free(root)
              legacy = json.dumps([{
                  'url': 'https://example.com/legacy',
                  'title': 'Legacy',
                  'created_at_epoch_millis': 1700000000050,
              }]).encode()
              legacy_first = core.xanh_sync_runtime_import_legacy_bookmarks(runtime, legacy)
              assert legacy_first
              assert json.loads(ctypes.string_at(legacy_first)) == {
                  'accepted_count': 1,
                  'existing_count': 0,
                  'created_count': 1,
              }
              core.xanh_sync_string_free(legacy_first)
              legacy_retry = core.xanh_sync_runtime_import_legacy_bookmarks(runtime, legacy)
              assert legacy_retry
              assert json.loads(ctypes.string_at(legacy_retry)) == {
                  'accepted_count': 1,
                  'existing_count': 1,
                  'created_count': 0,
              }
              core.xanh_sync_string_free(legacy_retry)
              folder = json.dumps({
                  'parent_guid': 'unfiled_____',
                  'position': None,
                  'kind': 'folder',
                  'title': 'CI folder',
                  'url': None,
                  'date_added_epoch_millis': 1700000000100,
                  'last_modified_epoch_millis': 1700000000101,
                  'is_private': False,
              }).encode()
              folder_guid_ptr = core.xanh_sync_runtime_create_bookmark(runtime, folder)
              assert folder_guid_ptr
              folder_guid = ctypes.string_at(folder_guid_ptr).decode()
              core.xanh_sync_string_free(folder_guid_ptr)
              bookmark = json.dumps({
                  'parent_guid': folder_guid,
                  'position': None,
                  'kind': 'bookmark',
                  'title': 'Before',
                  'url': 'https://example.com/old',
                  'date_added_epoch_millis': 1700000000102,
                  'last_modified_epoch_millis': 1700000000103,
                  'is_private': False,
              }).encode()
              bookmark_guid_ptr = core.xanh_sync_runtime_create_bookmark(runtime, bookmark)
              assert bookmark_guid_ptr
              bookmark_guid = ctypes.string_at(bookmark_guid_ptr).decode()
              core.xanh_sync_string_free(bookmark_guid_ptr)
              update_bookmark = json.dumps({
                  'guid': bookmark_guid,
                  'title': 'After',
                  'url': 'https://example.com/new',
                  'parent_guid': None,
                  'position': None,
                  'is_private': False,
              }).encode()
              assert core.xanh_sync_runtime_update_bookmark(runtime, update_bookmark)
              bookmark_tree_ptr = core.xanh_sync_runtime_bookmarks_json(runtime, 2)
              assert bookmark_tree_ptr
              bookmark_tree = json.loads(ctypes.string_at(bookmark_tree_ptr))
              core.xanh_sync_string_free(bookmark_tree_ptr)
              stored = next(item for item in bookmark_tree if item['guid'] == bookmark_guid)
              assert stored['title'] == 'After'
              assert stored['url'] == 'https://example.com/new'
              assert stored['is_openable'] is True

              visits = json.dumps([
                  {
                      'url': 'https://example.com/regular',
                      'title': 'Regular',
                      'visited_at_epoch_millis': 1700000000200,
                      'transition': 'typed',
                      'is_private': False,
                  },
                  {
                      'url': 'https://example.com/private',
                      'title': 'Private',
                      'visited_at_epoch_millis': 1700000000201,
                      'transition': 'link',
                      'is_private': True,
                  },
              ]).encode()
              history_result_ptr = core.xanh_sync_runtime_record_history(runtime, visits)
              assert history_result_ptr
              assert json.loads(ctypes.string_at(history_result_ptr)) == {
                  'accepted_count': 1,
                  'skipped_private_count': 1,
              }
              core.xanh_sync_string_free(history_result_ptr)
              history_retry_ptr = core.xanh_sync_runtime_record_history(runtime, visits)
              assert history_retry_ptr
              assert json.loads(ctypes.string_at(history_retry_ptr)) == {
                  'accepted_count': 1,
                  'skipped_private_count': 1,
              }
              core.xanh_sync_string_free(history_retry_ptr)
              history_ptr = core.xanh_sync_runtime_recent_history_json(runtime, 10)
              assert history_ptr
              history = json.loads(ctypes.string_at(history_ptr))
              core.xanh_sync_string_free(history_ptr)
              assert len(history) == 1
              assert history[0]['url'] == 'https://example.com/regular'
              assert core.xanh_sync_runtime_delete_history_visit(
                  runtime,
                  history[0]['url'].encode(),
                  history[0]['visited_at_epoch_millis'],
              )
              replacement_visit_ptr = core.xanh_sync_runtime_record_history(runtime, visits)
              assert replacement_visit_ptr
              core.xanh_sync_string_free(replacement_visit_ptr)
              assert core.xanh_sync_runtime_clear_history(runtime)
              cleared_history_ptr = core.xanh_sync_runtime_recent_history_json(runtime, 10)
              assert cleared_history_ptr
              assert json.loads(ctypes.string_at(cleared_history_ptr)) == []
              core.xanh_sync_string_free(cleared_history_ptr)
              assert core.xanh_sync_runtime_delete_bookmark(runtime, bookmark_guid.encode(), True) == -1
              assert core.xanh_sync_runtime_delete_bookmark(runtime, bookmark_guid.encode(), False) == 1
              assert core.xanh_sync_runtime_delete_bookmark(runtime, folder_guid.encode(), False) == 1
              core.xanh_sync_runtime_free(runtime)
              with tempfile.TemporaryDirectory() as replacement_profile:
                  replacement = core.xanh_sync_runtime_open(
                      config, replacement_profile.encode(), None, None, None
                  )
                  assert replacement
                  core.xanh_sync_runtime_free(replacement)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xanh-sync-core-linux-x64
          if-no-files-found: error
          path: |
            xanh-sync-core/target/release/libxanh_sync_core.so
            xanh-sync-core/target/release/libxanh_sync_core.so.sha256
            xanh-sync-core/target/bindings/**
