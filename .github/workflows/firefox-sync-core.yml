name: Firefox Sync core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-contract-and-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Verify pinned Application Services release
        run: |
          grep -Fx 'version=155.0' xanh-sync-core/APPLICATION_SERVICES.lock
          grep -Fx 'revision=c0fd8cea40c9b5dafc6604831f7bd7a8c096d313' xanh-sync-core/APPLICATION_SERVICES.lock
          cargo fmt --manifest-path xanh-sync-core/Cargo.toml --check
      - name: Test portable contract and FFI policy
        run: cargo test --locked --manifest-path xanh-sync-core/Cargo.toml
      - name: Compile-check Mozilla backend API
        run: |
          mkdir -p "$RUNNER_TEMP/fake-nss/lib" "$RUNNER_TEMP/fake-nss/include"
          NSS_DIR="$RUNNER_TEMP/fake-nss" NSS_STATIC=1 \
            cargo check --locked --features mozilla --manifest-path xanh-sync-core/Cargo.toml
      - name: Clippy
        run: >-
          NSS_DIR="$RUNNER_TEMP/fake-nss" NSS_STATIC=1
          cargo clippy --locked --features mozilla
          --manifest-path xanh-sync-core/Cargo.toml -- -D warnings
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: xanh-sync-core
      - uses: anchore/sbom-action@v0
        with:
          path: xanh-sync-core
          format: cyclonedx-json
          artifact-name: xanh-sync-core-sbom.cdx.json

  license-and-release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./scripts/verify-sync-release.sh source

  native-linux-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install NSS build dependencies
        run: sudo apt-get update && sudo apt-get install -y libnss3-dev libnspr4-dev
      - name: Prepare the NSS layout required by Application Services
        run: |
          mkdir -p "$RUNNER_TEMP/nss/lib" "$RUNNER_TEMP/nss/include"
          nss_libdir="$(pkg-config --variable=libdir nss)"
          nspr_libdir="$(pkg-config --variable=libdir nspr)"
          for library in libfreebl3.so libnss3.so libnssckbi.so libsoftokn3.so \
            libnssutil3.so; do
              test -f "$nss_libdir/$library"
              ln -sf "$nss_libdir/$library" "$RUNNER_TEMP/nss/lib/$library"
          done
          for library in libnspr4.so libplc4.so libplds4.so; do
              test -f "$nspr_libdir/$library"
              ln -sf "$nspr_libdir/$library" "$RUNNER_TEMP/nss/lib/$library"
          done
          cp -R /usr/include/nss/. "$RUNNER_TEMP/nss/include/"
          cp -R /usr/include/nspr/. "$RUNNER_TEMP/nss/include/"
      - name: Build the pinned native core
        run: |
          NSS_DIR="$RUNNER_TEMP/nss" LD_LIBRARY_PATH="$RUNNER_TEMP/nss/lib" \
            cargo test --locked --features mozilla \
            --manifest-path xanh-sync-core/Cargo.toml
          NSS_DIR="$RUNNER_TEMP/nss" cargo build --locked --release --features mozilla \
            --manifest-path xanh-sync-core/Cargo.toml
          ldd xanh-sync-core/target/release/libxanh_sync_core.so
          sha256sum xanh-sync-core/target/release/libxanh_sync_core.so \
            > xanh-sync-core/target/release/libxanh_sync_core.so.sha256
      - name: Generate the reviewed Kotlin and Swift UniFFI bindings
        working-directory: xanh-sync-core
        run: |
          mkdir -p target/bindings/kotlin target/bindings/swift
          CARGO_TARGET_DIR="$RUNNER_TEMP/uniffi-tool" \
            cargo run --locked --release --features bindgen-cli --manifest-path Cargo.toml \
            --bin xanh-uniffi-bindgen -- generate \
            --library target/release/libxanh_sync_core.so \
            --crate xanh_sync_core \
            --language kotlin --no-format --out-dir target/bindings/kotlin
          CARGO_TARGET_DIR="$RUNNER_TEMP/uniffi-tool" \
            cargo run --locked --release --features bindgen-cli --manifest-path Cargo.toml \
            --bin xanh-uniffi-bindgen -- generate \
            --library target/release/libxanh_sync_core.so \
            --crate xanh_sync_core \
            --language swift --no-format --out-dir target/bindings/swift
          grep -R -F 'class MozillaSyncRuntime' target/bindings/kotlin
          grep -R -F 'class MozillaSyncRuntime' target/bindings/swift
      - name: Smoke-test the stable C ABI without exposing the generated key
        run: |
          LD_LIBRARY_PATH="$RUNNER_TEMP/nss/lib" python3 - <<'PY'
          import ctypes
          import json
          import tempfile

          core = ctypes.CDLL('xanh-sync-core/target/release/libxanh_sync_core.so')
          core.xanh_sync_core_version.restype = ctypes.c_void_p
          core.xanh_sync_generate_local_logins_key.restype = ctypes.c_void_p
          core.xanh_sync_string_free.argtypes = [ctypes.c_void_p]
          core.xanh_sync_runtime_open.argtypes = [
              ctypes.c_char_p,
              ctypes.c_char_p,
              ctypes.c_char_p,
              ctypes.c_char_p,
              ctypes.c_char_p,
          ]
          core.xanh_sync_runtime_open.restype = ctypes.c_void_p
          core.xanh_sync_runtime_free.argtypes = [ctypes.c_void_p]
          core.xanh_sync_runtime_update_local_tabs.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          core.xanh_sync_runtime_update_local_tabs.restype = ctypes.c_void_p
          core.xanh_sync_runtime_remote_tabs_json.argtypes = [ctypes.c_void_p]
          core.xanh_sync_runtime_remote_tabs_json.restype = ctypes.c_void_p

          version = core.xanh_sync_core_version()
          key = core.xanh_sync_generate_local_logins_key()
          assert version and key
          core.xanh_sync_string_free(version)
          core.xanh_sync_string_free(key)

          config = json.dumps({
              'server': {'kind': 'mozilla'},
              'client_id': 'xanh-ci-contract',
              'redirect_uri': 'xanh-browser://accounts/oauth',
              'device_name': 'Xanh Browser CI',
              'device_kind': 'desktop',
          }).encode()
          with tempfile.TemporaryDirectory() as profile:
              runtime = core.xanh_sync_runtime_open(
                  config, profile.encode(), None, None, None
              )
              assert runtime
              local_tabs = json.dumps([
                  {
                      'title': 'Regular',
                      'url_history': ['https://example.com/regular'],
                      'icon_url': None,
                      'last_used_epoch_millis': 1700000000000,
                      'is_private': False,
                      'is_pinned': True,
                  },
                  {
                      'title': 'Private',
                      'url_history': ['https://example.com/private'],
                      'icon_url': None,
                      'last_used_epoch_millis': 1700000000001,
                      'is_private': True,
                      'is_pinned': False,
                  },
              ]).encode()
              update = core.xanh_sync_runtime_update_local_tabs(runtime, local_tabs)
              assert update
              assert json.loads(ctypes.string_at(update)) == {
                  'accepted_count': 1,
                  'skipped_private_count': 1,
              }
              core.xanh_sync_string_free(update)
              remote = core.xanh_sync_runtime_remote_tabs_json(runtime)
              assert remote and json.loads(ctypes.string_at(remote)) == []
              core.xanh_sync_string_free(remote)
              core.xanh_sync_runtime_free(runtime)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xanh-sync-core-linux-x64
          if-no-files-found: error
          path: |
            xanh-sync-core/target/release/libxanh_sync_core.so
            xanh-sync-core/target/release/libxanh_sync_core.so.sha256
            xanh-sync-core/target/bindings/**
