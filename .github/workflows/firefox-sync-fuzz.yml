name: Firefox Sync fuzzing

on:
  push:
    paths:
      - .github/workflows/firefox-sync-fuzz.yml
      - xanh-sync-core/Cargo.toml
      - xanh-sync-core/Cargo.lock
      - xanh-sync-core/src/**
      - xanh-sync-core/fuzz/**
  pull_request:
    paths:
      - .github/workflows/firefox-sync-fuzz.yml
      - xanh-sync-core/Cargo.toml
      - xanh-sync-core/Cargo.lock
      - xanh-sync-core/src/**
      - xanh-sync-core/fuzz/**
  schedule:
    - cron: '13 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-sync-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-portable-security-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-20
          components: rust-src
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Isolate generated corpus and crash artifacts
        run: |
          echo "FUZZ_CORPUS_ROOT=$RUNNER_TEMP/xanh-sync-fuzz-corpus" >> "$GITHUB_ENV"
          echo "FUZZ_ARTIFACT_ROOT=$RUNNER_TEMP/xanh-sync-fuzz-artifacts" >> "$GITHUB_ENV"
      - name: Verify and stage the locked seed corpora
        run: |
          cargo metadata --locked --manifest-path xanh-sync-core/fuzz/Cargo.toml \
            --no-deps --format-version 1 >/dev/null
          for target in bridge_message credential_context credential_context_ffi; do
            mkdir -p "$FUZZ_CORPUS_ROOT/$target" "$FUZZ_ARTIFACT_ROOT/$target"
            cp -a "xanh-sync-core/fuzz/corpus/$target/." "$FUZZ_CORPUS_ROOT/$target/"
          done
      - name: Build all fuzz targets from the locked graph
        run: cargo fuzz build --fuzz-dir xanh-sync-core/fuzz
      - name: Fuzz isolated bridge envelopes
        run: >-
          cargo fuzz run --fuzz-dir xanh-sync-core/fuzz bridge_message
          "$FUZZ_CORPUS_ROOT/bridge_message" --
          -runs=25000 -verbosity=0 -print_final_stats=1 -timeout=10 -max_len=262144
          -artifact_prefix="$FUZZ_ARTIFACT_ROOT/bridge_message/"
      - name: Fuzz credential context policy
        run: >-
          cargo fuzz run --fuzz-dir xanh-sync-core/fuzz credential_context
          "$FUZZ_CORPUS_ROOT/credential_context" --
          -runs=25000 -verbosity=0 -print_final_stats=1 -timeout=10 -max_len=262144
          -artifact_prefix="$FUZZ_ARTIFACT_ROOT/credential_context/"
      - name: Fuzz credential context C ABI
        run: >-
          cargo fuzz run --fuzz-dir xanh-sync-core/fuzz credential_context_ffi
          "$FUZZ_CORPUS_ROOT/credential_context_ffi" --
          -runs=25000 -verbosity=0 -print_final_stats=1 -timeout=10 -max_len=262144
          -artifact_prefix="$FUZZ_ARTIFACT_ROOT/credential_context_ffi/"
      - name: Reject crash artifacts
        if: always()
        run: |
          test -z "$(find "$FUZZ_ARTIFACT_ROOT" -type f -print -quit 2>/dev/null)"
          git diff --exit-code -- xanh-sync-core/fuzz/Cargo.lock
