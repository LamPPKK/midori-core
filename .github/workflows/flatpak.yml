name: Flatpak

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Build the pinned native blocker for the Flatpak sandbox
        run: |
          cargo build --locked --release --manifest-path xanh-adblock-core/Cargo.toml
          install -Dm755 xanh-adblock-core/target/release/libxanh_adblock_core.so \
            flatpak/native/libxanh_adblock_core.so
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: xanh-browser.flatpak
          manifest-path: flatpak/io.github.lamppkk.xanhbrowser.yml
          cache-key: flatpak-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: xanh-browser-flatpak
          path: xanh-browser.flatpak
