name: WebKit editions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wpe-android-fork-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch locked WPE Android source
        run: |
          revision="$(cat app-webkit/wpe-fork/WPE_ANDROID_REVISION)"
          cerbero_revision="$(cat app-webkit/wpe-fork/CERBERO_REVISION)"
          git init _wpe_android
          git -C _wpe_android remote add origin https://github.com/Igalia/wpe-android.git
          git -C _wpe_android fetch --depth=1 origin "${revision}"
          git -C _wpe_android checkout --detach FETCH_HEAD
          git init _cerbero
          git -C _cerbero remote add origin https://github.com/Igalia/wpe-android-cerbero.git
          git -C _cerbero fetch --depth=1 origin "${cerbero_revision}"
          git -C _cerbero checkout --detach FETCH_HEAD
      - name: Verify Xanh source-fork contract
        run: |
          ./scripts/verify-wpe-android-fork.sh _wpe_android _cerbero
          python3 -B -m unittest discover \
            -s scripts/tests -p 'test_create_wpe_build_evidence.py' -v
          bash -n scripts/build-wpe-android-fork.sh
          shellcheck \
            scripts/build-wpe-android-fork.sh \
            scripts/verify-wpe-android-fork.sh

  android-wpe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.1' 'build-tools;36.1.0'
      - name: Build and test Android WPE WebKit edition
        run: >-
          ./gradlew --no-daemon
          :backup-core:testDebugUnitTest
          :app-webkit:lintDebug
          :app-webkit:testDebugUnitTest
          :app-webkit:assembleDebug
          :app-webkit:assembleAndroidTest
          :app-webkit:bundleRelease
      - name: Verify embedded engine and ABI surface
        run: |
          expected="$(cat app-webkit/WPE_RUNTIME_VERSION)"
          unzip -p app-webkit/build/outputs/apk/debug/app-webkit-debug.apk \
            lib/arm64-v8a/libWPEWebKit-2.0.so > "$RUNNER_TEMP/libWPEWebKit-2.0.so"
          strings "$RUNNER_TEMP/libWPEWebKit-2.0.so" > "$RUNNER_TEMP/wpe-strings.txt"
          grep -F -m1 "wpewebkit-${expected}" "$RUNNER_TEMP/wpe-strings.txt"
          zipinfo -1 app-webkit/build/outputs/apk/debug/app-webkit-debug.apk | \
            grep -E '^lib/(arm64-v8a|x86_64)/'
          if zipinfo -1 app-webkit/build/outputs/apk/debug/app-webkit-debug.apk | \
            grep -Eq '^lib/(armeabi-v7a|x86)/'; then
            echo 'Unexpected unsupported Android ABI' >&2
            exit 1
          fi
      - name: Confirm published preview still fails the production 16 KiB gate
        run: |
          if ./scripts/verify-android-16k.sh \
            app-webkit/build/outputs/apk/debug/app-webkit-debug.apk; then
            echo 'Published WPEView preview unexpectedly passed; review and update the production gate' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: xanh-browser-lite-webkit-unsigned
          if-no-files-found: error
          path: |
            app-webkit/build/outputs/apk/debug/*.apk
            app-webkit/build/outputs/bundle/release/*.aab
            app-webkit/build/reports/lint-results-debug.*

  windows-wincairo-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify pinned stable WebKit release
        run: python3 scripts/verify_webkit_latest.py
      - name: Fetch pinned upstream patch inputs
        run: |
          revision="$(cat platform/windows-webkit/WEBKIT_REVISION)"
          files=(
            Source/WebKit/Shared/SessionState.h
            Source/WebKit/Shared/WebMouseEvent.cpp
            Source/WebKit/UIProcess/API/C/WKNavigationActionRef.cpp
            Source/WebKit/UIProcess/API/C/WKNavigationActionRef.h
            Source/WebKit/UIProcess/API/C/WKPage.cpp
            Source/WebKit/UIProcess/API/C/WKPage.h
            Source/WebKit/UIProcess/API/C/WKUserContentControllerRef.cpp
            Source/WebKit/UIProcess/API/C/WKUserContentControllerRef.h
            Source/WebKit/UIProcess/API/C/WKUserScriptRef.cpp
            Source/WebKit/UIProcess/API/C/WKUserScriptRef.h
            Source/WebKit/UIProcess/WebPageProxy.cpp
            Tools/MiniBrowser/win/BrowserWindow.h
            Tools/MiniBrowser/win/CMakeLists.txt
            Tools/MiniBrowser/win/MainWindow.cpp
            Tools/MiniBrowser/win/MainWindow.h
            Tools/MiniBrowser/win/MiniBrowserLib.rc
            Tools/MiniBrowser/win/MiniBrowserLibResource.h
            Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
            Tools/MiniBrowser/win/WebKitBrowserWindow.h
            Tools/MiniBrowser/win/WinMain.cpp
          )
          for file in "${files[@]}"; do
            mkdir -p "_webkit/$(dirname "${file}")"
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/WebKit/WebKit/${revision}/${file}" \
              --output "_webkit/${file}"
          done
      - name: Verify revision and source-fork contract
        run: |
          git -C _webkit init
          git -C _webkit apply --check --ignore-space-change "$GITHUB_WORKSPACE/platform/windows-webkit/patches/xanh-browser-webkit.patch"
          git -C _webkit apply --ignore-space-change "$GITHUB_WORKSPACE/platform/windows-webkit/patches/xanh-browser-webkit.patch"
          git -C _webkit apply --check --ignore-space-change "$GITHUB_WORKSPACE/platform/windows-webkit/patches/xanh-credential-bridge.patch"
          git -C _webkit apply --ignore-space-change "$GITHUB_WORKSPACE/platform/windows-webkit/patches/xanh-credential-bridge.patch"
          cp platform/windows-webkit/src/XanhCredentialBridgePolicy.h _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhCredentialPickerTypes.h _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhCredentialBridge.h _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhCredentialBridge.cpp _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhCredentialRecords.h _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhCredentialRecords.cpp _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhDpapiSecretStore.h _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhDpapiSecretStore.cpp _webkit/Tools/MiniBrowser/win/
          cp xanh-sync-core/include/xanh_sync.h _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhNativeSyncLibrary.h _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhNativeSyncLibrary.cpp _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhNativeSyncRuntime.h _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhNativeSyncRuntime.cpp _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhNativeCredentialPicker.h _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhNativeCredentialPicker.cpp _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhOAuthCallback.h _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhOAuthCallback.cpp _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhSyncResult.h _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhWindowsHello.h _webkit/Tools/MiniBrowser/win/
          cp platform/windows-webkit/src/XanhWindowsHello.cpp _webkit/Tools/MiniBrowser/win/
          grep -F 'OUTPUT_NAME "XanhBrowser.WebKit"' _webkit/Tools/MiniBrowser/win/CMakeLists.txt
          grep -F 'XanhPortableBackup.cpp' _webkit/Tools/MiniBrowser/win/CMakeLists.txt
          grep -F 'XanhDpapiSecretStore.cpp' _webkit/Tools/MiniBrowser/win/CMakeLists.txt
          grep -F 'XanhNativeSyncLibrary.cpp' _webkit/Tools/MiniBrowser/win/CMakeLists.txt
          grep -F 'XanhNativeSyncRuntime.cpp' _webkit/Tools/MiniBrowser/win/CMakeLists.txt
          grep -F 'XanhCredentialRecords.cpp' _webkit/Tools/MiniBrowser/win/CMakeLists.txt
          grep -F 'XanhNativeCredentialPicker.cpp' _webkit/Tools/MiniBrowser/win/CMakeLists.txt
          grep -F 'XanhOAuthCallback.cpp' _webkit/Tools/MiniBrowser/win/CMakeLists.txt
          grep -F 'crypt32' _webkit/Tools/MiniBrowser/win/CMakeLists.txt
          grep -F 'XanhWindowsHello.cpp' _webkit/Tools/MiniBrowser/win/CMakeLists.txt
          grep -F 'windowsapp' _webkit/Tools/MiniBrowser/win/CMakeLists.txt
          grep -F 'IDM_EXPORT_PORTABLE_BACKUP' _webkit/Tools/MiniBrowser/win/MainWindow.cpp
          grep -F 'IDM_IMPORT_PORTABLE_BACKUP' _webkit/Tools/MiniBrowser/win/MainWindow.cpp
          grep -F 'Export encrypted backup...' _webkit/Tools/MiniBrowser/win/MiniBrowserLib.rc
          grep -F 'https://duckduckgo.com/' _webkit/Tools/MiniBrowser/win/MainWindow.cpp
          grep -F 'WKPreferencesSetDeveloperExtrasEnabled(preferences.get(), false)' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'WK_EXPORT WKUserScriptRef WKXanhUserScriptCreateWithSourceInWorld' _webkit/Source/WebKit/UIProcess/API/C/WKUserScriptRef.h
          grep -F 'WK_EXPORT bool WKXanhUserContentControllerAddScriptMessageHandlerInWorld' _webkit/Source/WebKit/UIProcess/API/C/WKUserContentControllerRef.h
          grep -F 'API::ContentWorld::sharedWorldWithName(worldName)' _webkit/Source/WebKit/UIProcess/API/C/WKUserContentControllerRef.cpp
          grep -F 'm_name, contentWorld);' _webkit/Source/WebKit/UIProcess/API/C/WKUserContentControllerRef.cpp
          grep -F 'WK_EXPORT bool WKXanhNavigationActionIsRedirect' _webkit/Source/WebKit/UIProcess/API/C/WKNavigationActionRef.h
          grep -F 'WK_EXPORT bool WKXanhNavigationActionTakeUserGesture' _webkit/Source/WebKit/UIProcess/API/C/WKNavigationActionRef.h
          grep -F 'WK_EXPORT bool WKXanhNavigationActionIsTrustedLinkClick' _webkit/Source/WebKit/UIProcess/API/C/WKNavigationActionRef.h
          grep -F 'std::optional<HTTPBody> httpBody;' _webkit/Source/WebKit/Shared/SessionState.h
          grep -F 'We allow stale content when reloading a WebProcess' _webkit/Source/WebKit/UIProcess/WebPageProxy.cpp
          grep -F 'WK_EXPORT bool WKXanhPageCanSafelyRestoreCurrentItem' _webkit/Source/WebKit/UIProcess/API/C/WKPage.h
          grep -F 'XanhProcessRecovery::canSafelyRestoreFrameTree(item->mainFrameState().get())' _webkit/Source/WebKit/UIProcess/API/C/WKPage.cpp
          grep -F 'for (const auto& child : state->children)' _webkit/Source/WebKit/UIProcess/API/C/XanhFrameStateRestorePolicy.h
          grep -F 'if (mouseEventData && mouseEventData->buttonDown && mouseEventData->isTrusted)' _webkit/Source/WebKit/Shared/WebMouseEvent.cpp
          grep -F 'if (!userInitiatedAction || userInitiatedAction->consumed())' _webkit/Source/WebKit/UIProcess/API/C/WKNavigationActionRef.cpp
          grep -F 'userInitiatedAction->setConsumed();' _webkit/Source/WebKit/UIProcess/API/C/WKNavigationActionRef.cpp
          grep -F 'navigationClient.decidePolicyForNavigationAction = decidePolicyForNavigationAction' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'WKXanhNavigationActionIsRedirect(navigationAction)' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'WKXanhNavigationActionIsTrustedLinkClick(navigationAction)' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'bool shouldOpenExternal = decision == XanhNavigationPolicy::Decision::openExternal && WKXanhNavigationActionTakeUserGesture(navigationAction);' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'navigationClient.webProcessDidTerminate = webProcessDidTerminate' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'navigationClient.didFinishNavigation = didFinishNavigation' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'WKXanhPageCanSafelyRestoreCurrentItem(page)' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'WKPageReload(page)' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'WKPageGetIsControlledByAutomation(page)' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'navigationClient.didStartProvisionalNavigation = didStartProvisionalNavigation' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'navigationClient.didCommitNavigation = didCommitNavigation' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'navigationClient.didSameDocumentNavigation = didSameDocumentNavigation' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'm_credentialBridge->rendererTerminated(page)' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'GetForegroundWindow() == m_hMainWnd && IsWindowVisible(m_hMainWnd) && !IsIconic(m_hMainWnd)' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'm_nativeCredentialPicker = XanhNativeCredentialPicker::shared()' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'picker->cancel(mainWnd)' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'applicationActivationChanged(' _webkit/Tools/MiniBrowser/win/MainWindow.cpp
          grep -F 'beginFirefoxSync()' _webkit/Tools/MiniBrowser/win/MainWindow.cpp
          grep -F 'syncFirefoxSync()' _webkit/Tools/MiniBrowser/win/MainWindow.cpp
          grep -F 'disconnectFirefoxSync(true)' _webkit/Tools/MiniBrowser/win/MainWindow.cpp
          grep -F 'xanh-browser-wincairo:' _webkit/Tools/MiniBrowser/win/WinMain.cpp
          grep -F 'CreateMutexW(nullptr, FALSE, mutexName.c_str())' _webkit/Tools/MiniBrowser/win/WinMain.cpp
          grep -F 'SendMessageTimeoutW(primary, WM_COPYDATA' _webkit/Tools/MiniBrowser/win/WinMain.cpp
          grep -F 'case WM_COPYDATA:' _webkit/Tools/MiniBrowser/win/MainWindow.cpp
          grep -F 'routeFirefoxSyncCallback(std::move(incoming))' _webkit/Tools/MiniBrowser/win/MainWindow.cpp
          grep -F 'ShowWindow(activationWindow, SW_RESTORE)' _webkit/Tools/MiniBrowser/win/MainWindow.cpp
          grep -F 'canHandleFirefoxSyncCallback()' _webkit/Tools/MiniBrowser/win/MainWindow.cpp
          grep -F 'case XanhFirefoxSyncResultMessage:' _webkit/Tools/MiniBrowser/win/MainWindow.cpp
          grep -F '|| token != static_cast<WPARAM>(m_syncPresentationToken))' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'registerFirefoxSyncProtocol()' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'if (!m_nativeCredentialPicker->canBeginOAuth(m_hMainWnd))' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'return m_nativeCredentialPicker->completeOAuth(' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'ownerWindow, callback.view(), [ownerWindow, token](bool success)' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'm_nativeCredentialPicker->abandonOAuth(m_hMainWnd)' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'Thread construction must never unwind through the Win32 window procedure.' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'm_nativeCredentialPicker->syncNow(ownerWindow' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          grep -F 'm_nativeCredentialPicker->windowClosed(m_hMainWnd)' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp
          cmp platform/windows-webkit/src/XanhNavigationPolicy.h _webkit/Tools/MiniBrowser/win/XanhNavigationPolicy.h
          if grep -F 'XanhSyncWindowLifetime' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.h; then
            echo 'WinCairo background results must use UI-thread messages with generation tokens' >&2
            exit 1
          fi
          grep -F 'WKXanhUserContentControllerAddScriptMessageHandlerInWorld' _webkit/Tools/MiniBrowser/win/XanhCredentialBridge.cpp
          grep -F 'WKXanhUserContentControllerRemoveScriptMessageHandlerInWorld' _webkit/Tools/MiniBrowser/win/XanhCredentialBridge.cpp
          grep -F "if (event.isTrusted && event.isPrimary && event.button === 0) requestCredential(event.target)" _webkit/Tools/MiniBrowser/win/XanhCredentialBridge.cpp
          grep -F 'using XanhCredentialPicker = std::function<void(' _webkit/Tools/MiniBrowser/win/XanhCredentialPickerTypes.h
          grep -F 'std::weak_ptr<Lifetime> lifetime = m_lifetime;' _webkit/Tools/MiniBrowser/win/XanhCredentialBridge.cpp
          grep -F 'auto asyncSequence = token ? m_asyncGate.begin() : std::nullopt;' _webkit/Tools/MiniBrowser/win/XanhCredentialBridge.cpp
          grep -F '!selected || !m_foregroundCheck || !m_foregroundCheck() || !m_state.isCurrent(pending->token)' _webkit/Tools/MiniBrowser/win/XanhCredentialBridge.cpp
          grep -F '!m_asyncGate.finish(pending->asyncSequence)' _webkit/Tools/MiniBrowser/win/XanhCredentialBridge.cpp
          grep -F 'inline constexpr size_t maximumRequestsPerDocument = 64;' _webkit/Tools/MiniBrowser/win/XanhCredentialBridgePolicy.h
          grep -F 'class AsyncRequestGate' _webkit/Tools/MiniBrowser/win/XanhCredentialBridgePolicy.h
          if grep -F 'm_isControlledByAutomation' _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.cpp _webkit/Tools/MiniBrowser/win/WebKitBrowserWindow.h; then
            echo 'WinCairo must read live automation state rather than a stale per-window cache' >&2
            exit 1
          fi
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I _webkit/Tools/MiniBrowser/win \
            platform/windows-webkit/tests/XanhNavigationPolicyTest.cpp \
            -o /tmp/xanh-navigation-policy-test
          /tmp/xanh-navigation-policy-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I _webkit/Tools/MiniBrowser/win \
            platform/windows-webkit/tests/XanhProcessRecoveryPolicyTest.cpp \
            -o /tmp/xanh-process-recovery-policy-test
          /tmp/xanh-process-recovery-policy-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I _webkit/Source/WebKit/UIProcess/API/C \
            platform/windows-webkit/tests/XanhFrameStateRestorePolicyTest.cpp \
            -o /tmp/xanh-frame-state-restore-policy-test
          /tmp/xanh-frame-state-restore-policy-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I _webkit/Tools/MiniBrowser/win \
            platform/windows-webkit/tests/XanhCredentialBridgePolicyTest.cpp \
            -o /tmp/xanh-credential-bridge-policy-test
          /tmp/xanh-credential-bridge-policy-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I _webkit/Tools/MiniBrowser/win \
            _webkit/Tools/MiniBrowser/win/XanhCredentialRecords.cpp \
            platform/windows-webkit/tests/XanhCredentialRecordsTest.cpp \
            -o /tmp/xanh-credential-records-test
          /tmp/xanh-credential-records-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I _webkit/Tools/MiniBrowser/win \
            _webkit/Tools/MiniBrowser/win/XanhOAuthCallback.cpp \
            platform/windows-webkit/tests/XanhOAuthCallbackTest.cpp \
            -o /tmp/xanh-oauth-callback-test
          /tmp/xanh-oauth-callback-test
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I _webkit/Tools/MiniBrowser/win \
            platform/windows-webkit/tests/XanhSyncResultTest.cpp \
            -o /tmp/xanh-sync-result-test
          /tmp/xanh-sync-result-test

  windows-wincairo-portable-backup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure portable-backup golden-vector tests
        run: >-
          cmake
          -S platform/windows-webkit/tests/portable-backup
          -B _build/wincairo-portable-backup
          -A x64
      - name: Configure Windows Hello owner-window contract
        run: >-
          cmake
          -S platform/windows-webkit/tests/windows-hello
          -B _build/wincairo-windows-hello
          -A x64
      - name: Configure DPAPI secret-store contract
        run: >-
          cmake
          -S platform/windows-webkit/tests/dpapi-secret-store
          -B _build/wincairo-dpapi-secret-store
          -A x64
      - name: Configure native Sync DLL loader contract
        run: >-
          cmake
          -S platform/windows-webkit/tests/native-sync-library
          -B _build/wincairo-native-sync-library
          -A x64
      - name: Configure native credential-picker contract
        run: >-
          cmake
          -S platform/windows-webkit/tests/native-credential-picker
          -B _build/wincairo-native-credential-picker
          -A x64
      - name: Build portable-backup golden-vector tests
        run: cmake --build _build/wincairo-portable-backup --config Release --parallel
      - name: Build Windows Hello owner-window contract
        run: cmake --build _build/wincairo-windows-hello --config Release --parallel
      - name: Build DPAPI secret-store contract
        run: cmake --build _build/wincairo-dpapi-secret-store --config Release --parallel
      - name: Build native Sync DLL loader contract
        run: cmake --build _build/wincairo-native-sync-library --config Release --parallel
      - name: Build native credential-picker contract
        run: cmake --build _build/wincairo-native-credential-picker --config Release --parallel
      - name: Run portable-backup golden-vector tests
        run: ctest --test-dir _build/wincairo-portable-backup -C Release --output-on-failure
      - name: Run Windows Hello owner-window contract
        run: ctest --test-dir _build/wincairo-windows-hello -C Release --output-on-failure
      - name: Run DPAPI secret-store contract
        run: ctest --test-dir _build/wincairo-dpapi-secret-store -C Release --output-on-failure
      - name: Run native Sync DLL loader contract
        run: ctest --test-dir _build/wincairo-native-sync-library -C Release --output-on-failure
      - name: Run native credential-picker contract
        run: ctest --test-dir _build/wincairo-native-credential-picker -C Release --verbose --output-on-failure

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
