plugins {
    id 'com.android.application'
}

def syncFeatureEnabled = providers.gradleProperty('xanhEnableSyncFeature')
    .map { it.toBoolean() }.orElse(false).get()
def syncClientId = providers.gradleProperty('xanhWpeFxaClientId')
    .orElse(providers.environmentVariable('XANH_WPE_FXA_CLIENT_ID')).orElse('').get()
def syncProductionApproved = providers.gradleProperty('xanhFxaProductionApproved')
    .orElse(providers.environmentVariable('XANH_FXA_PRODUCTION_APPROVED'))
    .map { it == '1' || it.equalsIgnoreCase('true') }.orElse(false).get()
def syncSelfHostedOnly = providers.gradleProperty('xanhSyncSelfHostedOnly')
    .map { it.toBoolean() }.orElse(false).get()

def wpeViewVersion = file('WPEVIEW_VERSION').text.trim()
def wpeRuntimeVersion = file('WPE_RUNTIME_VERSION').text.trim()
def wpeProductionBaseline = rootProject.file('WEBKITGTK_MIN_VERSION').text.trim()
def wpeRuntimeProductionReady = false
def wpeForkAarPath = providers.gradleProperty('xanhWpeForkAar')
    .orElse(providers.environmentVariable('XANH_WPE_FORK_AAR')).orNull
def wpeForkAarSha256 = providers.gradleProperty('xanhWpeForkSha256')
    .orElse(providers.environmentVariable('XANH_WPE_FORK_SHA256')).orNull
def wpeForkEvidencePath = providers.gradleProperty('xanhWpeForkEvidence')
    .orElse(providers.environmentVariable('XANH_WPE_FORK_EVIDENCE')).orNull
def wpeForkEvidenceReady = !!wpeForkAarPath && !!wpeForkAarSha256 && !!wpeForkEvidencePath
def effectiveWpeRuntimeVersion = wpeForkAarPath
    ? file('wpe-fork/WPE_RUNTIME_VERSION').text.trim()
    : wpeRuntimeVersion

def uploadStoreFile = providers.gradleProperty('xanhWebKitUploadStoreFile')
    .orElse(providers.environmentVariable('XANH_WEBKIT_KEYSTORE')).orNull
def uploadStorePassword = providers.gradleProperty('xanhWebKitUploadStorePassword')
    .orElse(providers.environmentVariable('XANH_WEBKIT_STORE_PASSWORD')).orNull
def uploadKeyAlias = providers.gradleProperty('xanhWebKitUploadKeyAlias')
    .orElse(providers.environmentVariable('XANH_WEBKIT_KEY_ALIAS')).orNull
def uploadKeyPassword = providers.gradleProperty('xanhWebKitUploadKeyPassword')
    .orElse(providers.environmentVariable('XANH_WEBKIT_KEY_PASSWORD')).orNull
def hasUploadSigning = [uploadStoreFile, uploadStorePassword, uploadKeyAlias, uploadKeyPassword].every { it }

android {
    namespace = 'io.github.lamppkk.xanhbrowser.lite.webkit'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }
    buildToolsVersion = '36.1.0'

    defaultConfig {
        applicationId = 'io.github.lamppkk.xanhbrowser.lite.webkit'
        minSdk = 31
        targetSdk = 36
        versionCode = 10000
        versionName = '1.0.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        resValue 'string', 'wpe_view_version', wpeViewVersion
        resValue 'string', 'wpe_runtime_version', effectiveWpeRuntimeVersion
        buildConfigField 'boolean', 'XANH_WPE_SOURCE_FORK', wpeForkEvidenceReady.toString()
        buildConfigField 'String', 'XANH_WEBVIEW_RUNTIME_VERSION',
            '"' + effectiveWpeRuntimeVersion.replace('"', '\\"') + '"'
        buildConfigField 'boolean', 'XANH_SYNC_FEATURE_ENABLED', syncFeatureEnabled.toString()
        buildConfigField 'String', 'XANH_FXA_CLIENT_ID', '"' + syncClientId.replace('"', '\\"') + '"'
        buildConfigField 'boolean', 'XANH_FXA_PRODUCTION_APPROVED', syncProductionApproved.toString()
        buildConfigField 'boolean', 'XANH_SYNC_SELF_HOSTED_ONLY', syncSelfHostedOnly.toString()

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    dynamicFeatures = syncFeatureEnabled ? [':sync_feature_wpe'] : []

    signingConfigs {
        if (hasUploadSigning) {
            release {
                storeFile = file(uploadStoreFile)
                storePassword = uploadStorePassword
                keyAlias = uploadKeyAlias
                keyPassword = uploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasUploadSigning) signingConfig = signingConfigs.release
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        resValues = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

tasks.register('verifyWpeSyncFeatureConfiguration') {
    doLast {
        if (syncFeatureEnabled) {
            def mozillaHosted = !syncSelfHostedOnly && syncProductionApproved && !syncClientId.isBlank()
            if (!mozillaHosted && !syncSelfHostedOnly) {
                throw new GradleException(
                    'WPE Sync must be either Mozilla-hosted with an approved client ID or explicitly self-hosted-only'
                )
            }
        }
    }
}

if (syncFeatureEnabled) {
    tasks.matching { it.name == 'bundleRelease' || it.name == 'assembleRelease' }.configureEach {
        dependsOn 'verifyWpeSyncFeatureConfiguration'
    }
}

tasks.register('verifyWebKitReleaseSigning') {
    doLast {
        if (!hasUploadSigning) {
            throw new GradleException('Xanh Browser WebKit upload-key environment variables are not configured')
        }
    }
}

tasks.register('verifyWebKitProductionEngine') {
    doLast {
        if (!wpeRuntimeProductionReady) {
            def engine = wpeForkAarPath
                ? "source-fork candidate with WPE WebKit ${effectiveWpeRuntimeVersion}"
                : "WPEView ${wpeViewVersion} with WPE WebKit ${wpeRuntimeVersion}"
            throw new GradleException(
                "The ${engine} is not production-approved. Keep this edition in preview until " +
                    "WPE WebKit ${wpeProductionBaseline}+, full 16 KiB alignment, isolated-bridge " +
                    'and navigation-policy device tests, SBOM and security evidence are verified.'
            )
        }
    }
}

tasks.register('verifyWpeForkArtifact') {
    doLast {
        if (!wpeForkAarPath) return
        def artifact = file(wpeForkAarPath)
        if (!artifact.isFile()) {
            throw new GradleException("Xanh WPE fork AAR does not exist: ${artifact}")
        }
        if (!wpeForkAarSha256 || !(wpeForkAarSha256 ==~ /[0-9a-fA-F]{64}/)) {
            throw new GradleException(
                'xanhWpeForkSha256 or XANH_WPE_FORK_SHA256 must contain the reviewed AAR SHA-256'
            )
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        artifact.withInputStream { input ->
            byte[] buffer = new byte[64 * 1024]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        def actual = digest.digest().encodeHex().toString()
        if (!actual.equalsIgnoreCase(wpeForkAarSha256)) {
            throw new GradleException(
                "Xanh WPE fork AAR checksum mismatch: expected ${wpeForkAarSha256}, got ${actual}"
            )
        }
        if (!wpeForkEvidencePath) {
            throw new GradleException(
                'xanhWpeForkEvidence or XANH_WPE_FORK_EVIDENCE must identify the reviewed build manifest'
            )
        }
        def evidenceFile = file(wpeForkEvidencePath)
        if (!evidenceFile.isFile() || evidenceFile.length() <= 0 ||
                evidenceFile.length() > 1024 * 1024 ||
                java.nio.file.Files.isSymbolicLink(evidenceFile.toPath())) {
            throw new GradleException("Xanh WPE build evidence is missing or unsafe: ${evidenceFile}")
        }
        def evidence = new groovy.json.JsonSlurper().parse(evidenceFile)
        if (!(evidence instanceof Map) ||
                evidence.schema != 'io.github.lamppkk.xanhbrowser.wpe-build-evidence.v2') {
            throw new GradleException('Xanh WPE build evidence uses an unsupported schema')
        }
        def lockedRevision = file('wpe-fork/WPE_ANDROID_REVISION').text.trim()
        def lockedCerberoRevision = file('wpe-fork/CERBERO_REVISION').text.trim()
        def patchDigest = java.security.MessageDigest.getInstance('SHA-256')
            .digest(file('wpe-fork/patches/xanh-isolated-bridge.patch').bytes)
            .encodeHex().toString()
        def cerberoPatchDigest = java.security.MessageDigest.getInstance('SHA-256')
            .digest(file('wpe-fork/patches/cerbero-wpewebkit-2.52.6.patch').bytes)
            .encodeHex().toString()
        def expectedInputs = [
            cerbero_revision: lockedCerberoRevision,
            cerbero_source_patch_sha256: cerberoPatchDigest,
            source_patch_sha256: patchDigest,
            webkit_security_baseline: wpeProductionBaseline,
            wpe_android_revision: lockedRevision,
            wpe_runtime_version: effectiveWpeRuntimeVersion,
            wpeview_version: wpeViewVersion,
        ]
        if (evidence.inputs != expectedInputs) {
            throw new GradleException('Xanh WPE build evidence does not match the locked source inputs')
        }
        if (!(evidence.artifact instanceof Map) ||
                evidence.artifact.sha256 != actual ||
                evidence.artifact.size != artifact.length() ||
                evidence.artifact.file != artifact.name) {
            throw new GradleException('Xanh WPE artifact does not match its evidence record')
        }
        def evidenceArtifact = new File(evidenceFile.parentFile, evidence.artifact.file.toString())
        if (artifact.canonicalFile != evidenceArtifact.canonicalFile) {
            throw new GradleException('The configured AAR is not the artifact bound by the evidence manifest')
        }
    }
}

if (wpeForkAarPath) {
    tasks.matching { it.name == 'preBuild' }.configureEach {
        dependsOn 'verifyWpeForkArtifact'
    }
}

tasks.matching { it.name == 'bundleRelease' }.configureEach {
    mustRunAfter 'verifyWebKitReleaseSigning', 'verifyWebKitProductionEngine'
}

tasks.register('bundleWebKitProductionRelease') {
    dependsOn 'verifyWebKitReleaseSigning', 'verifyWebKitProductionEngine', 'bundleRelease'
}

dependencies {
    implementation project(':backup-core')
    implementation 'com.google.android.play:feature-delivery-ktx:2.1.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.webkit:webkit:1.17.0'
    implementation 'com.google.android.material:material:1.14.0'
    if (wpeForkAarPath) {
        implementation files(wpeForkAarPath)
    } else {
        implementation "org.wpewebkit.wpeview:wpeview:${wpeViewVersion}"
    }

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
