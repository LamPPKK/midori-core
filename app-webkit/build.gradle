plugins {
    id 'com.android.application'
}

def wpeViewVersion = file('WPEVIEW_VERSION').text.trim()
def wpeRuntimeVersion = file('WPE_RUNTIME_VERSION').text.trim()
def wpeRuntimeProductionReady = false

def uploadStoreFile = providers.gradleProperty('xanhWebKitUploadStoreFile')
    .orElse(providers.environmentVariable('XANH_WEBKIT_KEYSTORE')).orNull
def uploadStorePassword = providers.gradleProperty('xanhWebKitUploadStorePassword')
    .orElse(providers.environmentVariable('XANH_WEBKIT_STORE_PASSWORD')).orNull
def uploadKeyAlias = providers.gradleProperty('xanhWebKitUploadKeyAlias')
    .orElse(providers.environmentVariable('XANH_WEBKIT_KEY_ALIAS')).orNull
def uploadKeyPassword = providers.gradleProperty('xanhWebKitUploadKeyPassword')
    .orElse(providers.environmentVariable('XANH_WEBKIT_KEY_PASSWORD')).orNull
def hasUploadSigning = [uploadStoreFile, uploadStorePassword, uploadKeyAlias, uploadKeyPassword].every { it }

android {
    namespace = 'io.github.lamppkk.xanhbrowser.lite.webkit'
    compileSdk = 36

    defaultConfig {
        applicationId = 'io.github.lamppkk.xanhbrowser.lite.webkit'
        minSdk = 31
        targetSdk = 36
        versionCode = 10000
        versionName = '1.0.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        resValue 'string', 'wpe_view_version', wpeViewVersion
        resValue 'string', 'wpe_runtime_version', wpeRuntimeVersion

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        if (hasUploadSigning) {
            release {
                storeFile = file(uploadStoreFile)
                storePassword = uploadStorePassword
                keyAlias = uploadKeyAlias
                keyPassword = uploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasUploadSigning) signingConfig = signingConfigs.release
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = false
        resValues = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

tasks.register('verifyWebKitReleaseSigning') {
    doLast {
        if (!hasUploadSigning) {
            throw new GradleException('Xanh Browser WebKit upload-key environment variables are not configured')
        }
    }
}

tasks.register('verifyWebKitProductionEngine') {
    doLast {
        if (!wpeRuntimeProductionReady) {
            throw new GradleException(
                "WPEView ${wpeViewVersion} embeds WPE WebKit ${wpeRuntimeVersion} and ships a native " +
                    'library that is not 16 KiB page aligned. Keep this edition in preview until a ' +
                    'WPEView release with WPE WebKit 2.52.5+ and full 16 KiB alignment is verified.'
            )
        }
    }
}

tasks.matching { it.name == 'bundleRelease' }.configureEach {
    mustRunAfter 'verifyWebKitReleaseSigning', 'verifyWebKitProductionEngine'
}

tasks.register('bundleWebKitProductionRelease') {
    dependsOn 'verifyWebKitReleaseSigning', 'verifyWebKitProductionEngine', 'bundleRelease'
}

dependencies {
    implementation project(':backup-core')
    implementation 'androidx.activity:activity-ktx:1.12.3'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation "org.wpewebkit.wpeview:wpeview:${wpeViewVersion}"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
