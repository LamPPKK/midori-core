name: XanhBrowserApple
options:
  bundleIdPrefix: io.github.lamppkk
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 10000
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Xanh Browser
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Xanh Browser shares location only with a website after you approve its request.
    INFOPLIST_KEY_NSCameraUsageDescription: Xanh Browser shares the camera only with a website after you approve its request.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Xanh Browser shares the microphone only with a website after you approve its request.
targets:
  XanhBrowser-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - Sources/XanhBrowserCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lamppkk.xanhbrowser
        PRODUCT_NAME: Xanh Browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-iOS
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  XanhBrowser-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - Sources/XanhBrowserCore
    entitlements:
      path: Config/XanhBrowserMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.device.microphone: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lamppkk.xanhbrowser.macos
        PRODUCT_NAME: Xanh Browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-macOS
        CODE_SIGN_ENTITLEMENTS: Config/XanhBrowserMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  XanhBrowser-iOS:
    build:
      targets:
        XanhBrowser-iOS: all
  XanhBrowser-macOS:
    build:
      targets:
        XanhBrowser-macOS: all
