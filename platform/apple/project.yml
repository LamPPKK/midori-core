name: XanhBrowserApple
options:
  bundleIdPrefix: io.github.lamppkk
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 10000
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: NO
    XANH_FXA_CLIENT_ID: ""
    XANH_FXA_PRODUCTION_APPROVED: "0"
    XANH_SYNC_SWIFT_FLAGS: ""
    OTHER_SWIFT_FLAGS: $(inherited) $(XANH_SYNC_SWIFT_FLAGS)
targets:
  XanhBrowser-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - Sources/XanhBrowserCore
      - Generated
    info:
      path: Config/XanhBrowser-iOS-Info.plist
      properties:
        CFBundleDisplayName: Xanh Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: io.github.lamppkk.xanhbrowser.firefox-sync
            CFBundleURLSchemes:
              - xanh-browser-ios
        NSCameraUsageDescription: Xanh Browser shares the camera only with a website after you approve its request.
        NSLocationWhenInUseUsageDescription: Xanh Browser shares location only with a website after you approve its request.
        NSMicrophoneUsageDescription: Xanh Browser shares the microphone only with a website after you approve its request.
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        XanhFirefoxSyncClientID: $(XANH_FXA_CLIENT_ID)
        XanhFirefoxSyncProductionApproved: $(XANH_FXA_PRODUCTION_APPROVED)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lamppkk.xanhbrowser
        PRODUCT_NAME: Xanh Browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-iOS
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  XanhBrowser-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - Sources/XanhBrowserCore
      - Generated
    info:
      path: Config/XanhBrowser-macOS-Info.plist
      properties:
        CFBundleDisplayName: Xanh Browser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: io.github.lamppkk.xanhbrowser.macos.firefox-sync
            CFBundleURLSchemes:
              - xanh-browser-macos
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCameraUsageDescription: Xanh Browser shares the camera only with a website after you approve its request.
        NSLocationUsageDescription: Xanh Browser shares location only with a website after you approve its request.
        NSMicrophoneUsageDescription: Xanh Browser shares the microphone only with a website after you approve its request.
        XanhFirefoxSyncClientID: $(XANH_FXA_CLIENT_ID)
        XanhFirefoxSyncProductionApproved: $(XANH_FXA_PRODUCTION_APPROVED)
    entitlements:
      path: Config/XanhBrowserMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.device.microphone: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lamppkk.xanhbrowser.macos
        PRODUCT_NAME: Xanh Browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-macOS
        CODE_SIGN_ENTITLEMENTS: Config/XanhBrowserMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  XanhBrowser-iOS:
    build:
      targets:
        XanhBrowser-iOS: all
  XanhBrowser-macOS:
    build:
      targets:
        XanhBrowser-macOS: all
