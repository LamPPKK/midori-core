[package]
name = "xanh-adblock-core"
version = "1.0.0-alpha.1"
edition = "2021"
license = "MPL-2.0"
description = "Cross-platform ad blocking core for Xanh Browser"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = [
    "content-blocking",
    "embedded-domain-resolver",
    "full-regex-handling",
] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
static_assertions = "1.1"
