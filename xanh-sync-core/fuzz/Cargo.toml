[package]
name = "xanh-sync-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
xanh-sync-core = { path = ".." }

[[bin]]
name = "bridge_message"
path = "fuzz_targets/bridge_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "credential_context"
path = "fuzz_targets/credential_context.rs"
test = false
doc = false
bench = false

[[bin]]
name = "credential_context_ffi"
path = "fuzz_targets/credential_context_ffi.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
